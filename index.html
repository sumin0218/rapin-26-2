<body>
<a class="skip" href="#program" data-i18n="skip">순서표로 바로 가기</a>

<header class="topbar" role="banner">
  <!-- 공연 정보 띠: 한 줄에 다 들어가면 그대로, 넘치면 전광판처럼 흘러가요 (main.js의 initBand) -->
  <div class="band" role="text">
    <div class="band-track">
      <span class="band-item"><span data-i18n="bandPre">경희대학교 흑인음악동아리 래빈 정기공연</span> <b class="band-when" data-i18n="bandWhen">12.03(목) 19:00-21:00</b> <span data-i18n="bandVenue">학생회관 소극장</span></span>
    </div>
  </div>
  <nav class="lang" aria-label="언어" data-i18n-attr="aria-label:lang">
    <button type="button" data-lang="ko" lang="ko">한국어</button>
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="zh" lang="zh">中文</button>
  </nav>
</header>

<!-- 배경음악 켜기/끄기 (오른쪽 위, 헬리콥터 반대편) -->
<button type="button" class="bgm-btn" id="bgm-btn" aria-pressed="true"
        data-i18n-attr="data-label-on:bgmOn,data-label-off:bgmOff" data-label-on="배경음악 켜기" data-label-off="배경음악 끄기">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path class="bgm-body" d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"/>
    <path class="wave w1" d="M14.6 9.4a3.6 3.6 0 0 1 0 5.2"/>
    <path class="wave w2" d="M16.9 7.2a6.7 6.7 0 0 1 0 9.6"/>
    <path class="mute" d="M15 9.5l5 5M20 9.5l-5 5"/>
  </svg>
</button>

<!-- 오른쪽 가장자리 책갈피 탭: 포스터에서도 셋리스트에서도 항상 같은 자리 -->
<nav class="side-tabs" aria-label="바로가기" data-i18n-attr="aria-label:menu">
  <a class="side-tab" href="#info" data-i18n="infoTitle">공연 정보</a>
  <a class="side-tab" href="#artists" data-i18n="artistsTitle">아티스트 소개</a>
</nav>

<main id="top">
  <!-- 모션 포스터
       화면 가득 포스터 → 스크롤하면 요소들이 화면 밖으로 빠져나가며 빨려 들어가고 → 개선문 배경 위로 셋리스트가 올라와요.
       공연 정보와 아티스트 소개는 오른쪽 책갈피 탭으로 패널을 열어요.
       포스터 레이어는 assets/js/motion/poster-layers.js 에서 만들어요. -->
  <section class="poster pin-wrap" id="poster" aria-labelledby="poster-title">
    <div class="stage">
      <div class="loader" aria-hidden="true">
        <div class="ld-word">LOADING</div>
        <div class="ld-bar"><i></i></div>
        <div class="ld-pct">0%</div>
      </div>
      <div class="poster-cam">
        <div class="poster-art" role="img" aria-label="SAGGING 2026 포스터" data-i18n-attr="aria-label:posterAlt"></div>
      </div>
      <h1 id="poster-title" class="sr-only" data-i18n="title">RAP-IN 26-2 정기공연 SAGGING 2026</h1>
      <button type="button" class="scroll-cue">
        <span class="cue-text"><b class="cue-big">SCROLL</b><span class="cue-sub" data-i18n="scrollHint">셋리스트 보기</span></span>
        <span class="cue-arrows" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>

    </div>
    <!-- 셋리스트: 개선문 배경(위 .stage) 위에 겹쳐 두고, 요소들이 빠져나가는 동안에는
         브라우저가 sticky 로 제자리에 붙잡아 둬요(떨림 없음). 그 뒤로는 그냥 스크롤돼요. -->
    <div class="lineup-hold">
    <section class="lineup" id="lineup" aria-labelledby="program-title">
        <div class="lineup-inner">
          <h2 id="program-title" class="lineup-title" lang="en"><img src="assets/img/setlist-title.webp" alt="Setlist" width="1200" height="348" decoding="async"></h2>
          <div id="setlist" class="setlist"></div>
        </div>
      </section>
      <!-- 요소들이 빠져나가는 동안 스크롤할 거리 -->
      <div class="pin-spacer-gap" aria-hidden="true"></div>
    </div>
  </section>
</main>

<!-- 버튼으로 여는 패널. 주소 끝의 #info, #artists 로 열리고 뒤로가기로 닫혀요 -->
<!-- 공연 정보: 동네 전봇대에 붙은 공연 전단 / 입장권 느낌 -->
<div class="panel hood" id="info" role="dialog" aria-modal="true" aria-labelledby="info-title" hidden>
  <div class="panel-body">
    <a class="panel-close" href="#" aria-label="닫기" data-i18n-attr="aria-label:close">×</a>
    <h2 id="info-title" class="hood-title" data-i18n="infoTitle">공연 정보</h2>

    <div class="ticket">
      <div class="t-when">
        <p class="t-kicker" lang="en">SAGGING 2026</p>
        <p class="t-date"><b data-bind="dateBig">12.03</b><span data-bind="dow">THU</span></p>
        <p class="t-time" data-bind="timeText">19:00 - 21:00</p>
      </div>
      <div class="t-where">
        <p class="t-label" data-i18n="venue">장소</p>
        <p class="t-venue" data-bind="venueMain">학생회관 소극장</p>
        <p class="t-sub" data-bind="venueSub">경희대학교 국제캠퍼스</p>
        <div class="t-maps" id="maps"></div>
      </div>
      <div class="t-stub">
        <p class="t-label" data-i18n="admission">입장</p>
        <p class="t-adm" data-bind="admission">무료 입장</p>
        <p class="t-no" lang="en">RAP-IN · 26-2</p>
      </div>
    </div>

    <dl class="info-list sr-only">
      <div><dt data-i18n="date">일시</dt><dd data-bind="dateText"></dd></div>
      <div><dt data-i18n="venue">장소</dt><dd data-bind="venue"></dd></div>
    </dl>

    <!-- 동아리 소개 (간단히) -->
    <div class="about">
      <h3 data-i18n="aboutTitle">RAP-IN</h3>
      <p data-i18n="aboutText">경희대학교 흑인음악 동아리 RAP-IN입니다.</p>
      <ul class="links" id="links"></ul>
      <p class="copy">© <span data-bind="year"></span> RAP-IN</p>
    </div>
  </div>
</div>

<!-- 아티스트 소개: 공터 벽에 오려 붙인 사진 콜라주. 사진을 누르면 그 사람 정보가 떠요 -->
<div class="panel wall" id="artists" role="dialog" aria-modal="true" aria-labelledby="artists-title" hidden>
  <a class="panel-close wall-close" href="#" aria-label="닫기" data-i18n-attr="aria-label:close">×</a>
  <div class="wall-scroll">
    <h2 id="artists-title" class="wall-title"><span data-i18n="artistsTitle">아티스트 소개</span></h2>
    <ul class="wall-board" id="wall-board"></ul>
  </div>
</div>

<!-- 아티스트 정보 카드 -->
<div class="artist-card" id="artist-card" role="dialog" aria-modal="true" aria-labelledby="ac-name" hidden>
  <div class="ac-wrap">
  <button type="button" class="ac-nav ac-prev" aria-label="이전 아티스트" data-i18n-attr="aria-label:prevArtist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3.5 5 12l12 8.5z"/></svg></button>
  <div class="ac-paper">
    <button type="button" class="ac-x" aria-label="닫기" data-i18n-attr="aria-label:close">×</button>
    <div class="ac-photo"><img id="ac-img" alt="" draggable="false"></div>
    <div class="ac-info">
      <p class="ac-dept" id="ac-dept"></p>
      <div class="ac-nameline">
        <h3 class="ac-name" id="ac-name"></h3>
        <p class="ac-school" id="ac-school"></p>
      </div>
      <a class="ac-ig" id="ac-ig" target="_blank" rel="noopener"></a>
      <p class="ac-bio" id="ac-bio"></p>
    </div>
  </div>
  <button type="button" class="ac-nav ac-next" aria-label="다음 아티스트" data-i18n-attr="aria-label:nextArtist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5 19 12 7 20.5z"/></svg></button>
  <p class="ac-count" id="ac-count" aria-live="polite"></p>
  </div>
</div>

<!-- GSAP은 외부 CDN 대신 저장소 안에 같이 둬요 (공연장 와이파이가 불안정해도 동작하게) -->
<script src="assets/vendor/gsap.min.js" defer></script>
<script src="assets/vendor/ScrollTrigger.min.js" defer></script>
