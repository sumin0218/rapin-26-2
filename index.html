<!DOCTYPE html>
<html lang="ko" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAP-IN 26-2 정기공연</title>
<meta name="description" content="RAP-IN 26-2 정기공연 공식 큐시트. 공연 정보와 순서표를 확인하세요.">
<meta name="theme-color" content="#0d0d0d">

<!-- 공유 미리보기 (카카오톡, 인스타그램 등). 배포 주소가 정해지면 og:url, og:image를 절대 주소로 바꿔 주세요 -->
<meta property="og:type" content="website">
<meta property="og:title" content="RAP-IN 26-2 정기공연">
<meta property="og:description" content="공연 정보와 순서표">
<meta property="og:image" content="assets/img/og/og-image.png">
<meta property="og:url" content="https://sumin0218.github.io/rapin-26-2/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/audio/bgm.mp3" as="audio" type="audio/mpeg">
<link rel="stylesheet" href="assets/css/base.css?v=11221505">
<link rel="stylesheet" href="assets/css/layout.css?v=11221505">
<link rel="stylesheet" href="assets/css/poster.css?v=11221505">
<link rel="stylesheet" href="assets/css/program.css?v=11221505">
<script>document.documentElement.classList.replace("no-js","js");</script>
</head>
<body>
<a class="skip" href="#program" data-i18n="skip">순서표로 바로 가기</a>

<header class="topbar" role="banner">
  <!-- 공연 정보 띠: 한 줄에 다 들어가면 그대로, 넘치면 전광판처럼 흘러가요 (main.js의 initBand) -->
  <div class="band" role="text">
    <div class="band-track">
      <span class="band-item"><span data-i18n="bandPre">경희대학교 흑인음악동아리 래빈 정기공연</span> <b class="band-when" data-i18n="bandWhen">12.03(목) 19:00-21:00</b> <span data-i18n="bandVenue">학생회관 소극장</span></span>
    </div>
  </div>
  <nav class="lang" aria-label="언어" data-i18n-attr="aria-label:lang">
    <button type="button" data-lang="ko" lang="ko">한국어</button>
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="zh" lang="zh">中文</button>
  </nav>
</header>

<!-- 배경음악 켜기/끄기 (오른쪽 위, 헬리콥터 반대편) -->
<button type="button" class="bgm-btn" id="bgm-btn" aria-pressed="true"
        data-i18n-attr="data-label-on:bgmOn,data-label-off:bgmOff" data-label-on="배경음악 켜기" data-label-off="배경음악 끄기">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path class="spk" d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"/>
    <path class="wave w1" d="M14.6 9.4a3.6 3.6 0 0 1 0 5.2"/>
    <path class="wave w2" d="M16.9 7.2a6.7 6.7 0 0 1 0 9.6"/>
    <path class="mute" d="M15 9.5l5 5M20 9.5l-5 5"/>
  </svg>
</button>

<main id="top">
  <!-- 모션 포스터
       화면 가득 포스터 → 스크롤하면 요소들이 화면 밖으로 빠져나가며 빨려 들어가고 → 개선문 배경 위로 셋리스트가 올라와요.
       공연 정보와 아티스트 소개는 셋리스트 맨 아래 버튼으로 패널을 열어요.
       포스터 레이어는 assets/js/motion/poster-layers.js 에서 만들어요. -->
  <section class="poster pin-wrap" id="poster" aria-labelledby="poster-title">
    <div class="stage">
      <div class="poster-cam">
        <div class="poster-art" role="img" aria-label="SAGGING 2026 포스터" data-i18n-attr="aria-label:posterAlt"></div>
      </div>
      <h1 id="poster-title" class="sr-only" data-i18n="title">RAP-IN 26-2 정기공연 SAGGING 2026</h1>
      <button type="button" class="scroll-cue">
        <span class="cue-text" data-i18n="scrollHint">내려서 입장하기</span>
        <span class="cue-arrows" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>

    </div>
    <!-- 요소들이 빠져나가는 동안 스크롤할 거리 -->
    <div class="pin-spacer-gap" aria-hidden="true"></div>
    <!-- 셋리스트: 개선문 배경(위 .stage)이 뒤에 붙어 있는 채로 그 위를 스크롤해 올라와요 -->
    <section class="lineup" id="lineup" aria-labelledby="program-title">
        <div class="lineup-inner">
          <h2 id="program-title" class="lineup-title" lang="en">Setlist</h2>
          <div id="setlist" class="setlist"></div>
          <nav class="lineup-more" aria-label="더 보기" data-i18n-attr="aria-label:menu">
            <a class="menu-btn" href="#info" data-i18n="infoTitle">공연 정보</a>
            <a class="menu-btn" href="#artists" data-i18n="artistsTitle">아티스트 소개</a>
          </nav>
        </div>
      </section>
  </section>
</main>

<!-- 버튼으로 여는 패널. 주소 끝의 #info, #artists 로 열리고 뒤로가기로 닫혀요 -->
<div class="panel" id="info" role="dialog" aria-modal="true" aria-labelledby="info-title" hidden>
  <div class="panel-body">
    <a class="panel-close" href="#" aria-label="닫기" data-i18n-attr="aria-label:close">×</a>
    <h2 id="info-title" data-i18n="infoTitle">공연 정보</h2>
    <dl class="info-list">
      <div><dt data-i18n="date">일시</dt><dd data-bind="dateText"></dd></div>
      <div><dt data-i18n="venue">장소</dt><dd><a data-bind="venue" data-bind-href="mapUrl" target="_blank" rel="noopener"></a></dd></div>
      <div><dt data-i18n="admission">입장</dt><dd data-bind="admission"></dd></div>
    </dl>
    <!-- 동아리 소개 (간단히) -->
    <div class="about">
      <h3 data-i18n="aboutTitle">RAP-IN</h3>
      <p data-i18n="aboutText">경희대학교 힙합 동아리 RAP-IN입니다.</p>
      <ul class="links" id="links"></ul>
      <p class="copy">© <span data-bind="year"></span> RAP-IN</p>
    </div>
  </div>
</div>

<div class="panel" id="artists" role="dialog" aria-modal="true" aria-labelledby="artists-title" hidden>
  <div class="panel-body">
    <a class="panel-close" href="#" aria-label="닫기" data-i18n-attr="aria-label:close">×</a>
    <h2 id="artists-title" data-i18n="artistsTitle">아티스트 소개</h2>
    <p class="soon" data-i18n="artistsSoon">아티스트 소개는 곧 공개돼요.</p>
  </div>
</div>

<!-- GSAP은 외부 CDN 대신 저장소 안에 같이 둬요 (공연장 와이파이가 불안정해도 동작하게) -->
<script src="assets/vendor/gsap.min.js" defer></script>
<script src="assets/vendor/ScrollTrigger.min.js" defer></script>
<script type="module" src="assets/js/main.js?v=11221505"></script>
</body>
</html>
